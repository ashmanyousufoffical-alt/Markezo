<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markezo</title>
<meta name="description" content="Markezo: eleven local shops in one online bazaar. Browse each store, see products and location, and message the shop on WhatsApp.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0E1424">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar"><div class="wrap">
  <a class="logo" href="#home" aria-label="Markezo home"><span class="mk" id="logoIc"></span>Markezo</a>
  <div class="tools">
    <button class="ibtn" id="themeBtn" type="button" aria-label="Switch light or dark theme"></button>
    <button class="cartbtn" id="cartBtn" type="button" aria-label="Open request list"><span class="t">Request list</span><b id="cartCount">0</b></button>
  </div>
</div></div>

<main id="view"></main>

<footer><div class="wrap"><div><b>Markezo</b><p>Eleven local shops, one online bazaar. Each shop confirms its prices when you message it.</p></div></div></footer>

<button class="fab" id="fab" type="button" hidden>View request list <b id="fabCount">0</b></button>
<div class="toast" id="toast" hidden></div>
<div class="bot" id="bot" role="complementary" aria-label="Marky, the Markezo helper">
  <button class="botface" id="botFace" type="button" aria-label="Show or hide the helper">
    <svg viewBox="0 0 64 76" aria-hidden="true">
      <defs><linearGradient id="botg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C896"/><stop offset="1" stop-color="#0B6E5B"/></linearGradient></defs>
      <line x1="32" y1="6" x2="32" y2="16" stroke="#0E1424" stroke-width="3" stroke-linecap="round"/>
      <circle class="bot-led" cx="32" cy="6" r="4.2" fill="#FFC233"/>
      <rect x="3" y="30" width="6" height="14" rx="3" fill="#0B6E5B"/>
      <rect x="55" y="30" width="6" height="14" rx="3" fill="#0B6E5B"/>
      <rect x="8" y="16" width="48" height="38" rx="15" fill="url(#botg)"/>
      <rect x="14" y="22" width="36" height="26" rx="11" fill="#0E1424"/>
      <rect class="bot-eye" x="21" y="29" width="7" height="10" rx="3.5" fill="#2EE6B0"/>
      <rect class="bot-eye" x="36" y="29" width="7" height="10" rx="3.5" fill="#2EE6B0"/>
      <path d="M26 43c3 2.4 9 2.4 12 0" fill="none" stroke="#FFC233" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="18" y="56" width="28" height="16" rx="8" fill="url(#botg)"/>
      <circle cx="32" cy="64" r="3" fill="#FFC233"/>
    </svg>
  </button>
  <div class="bubble" id="botBubble">
    <p id="botText"></p>
    <div class="botacts" id="botActs"></div>
    <div class="botq">
      <div class="botchips" id="botChips"></div>
      <form class="botask" id="botForm"><input id="botQ" type="text" placeholder="Ask Marky a question..." autocomplete="off" enterkeyhint="send" aria-label="Ask Marky a question"><button type="submit">Ask</button></form>
    </div>
    <div class="botbtns"><button id="botListen" type="button" aria-label="Read this aloud"></button><button id="botHide" type="button" aria-label="Hide the helper"></button></div>
  </div>
</div>
<div id="veil" class="veil" hidden></div>
<aside id="panel" class="panel" hidden aria-label="Request list">
  <header><h2>Request list</h2><button class="ibtn" id="closeCart" type="button" aria-label="Close"></button></header>
  <p class="hint">Tap Send on WhatsApp to open a chat with the shop. Your request is already typed in the message.</p>
  <div class="list2" id="cartBody"></div>
</aside>

<script src="script.js"></script>
</body>
</html>
